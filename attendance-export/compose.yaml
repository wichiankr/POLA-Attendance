services:
  attendance-export:
    build: .
    image: pola-attendance-export:local
    init: true
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      SPREADSHEET_ID: ${SPREADSHEET_ID:?Set SPREADSHEET_ID in .env}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/service-account.json
      SFTP_CONFIG_FILE: /run/secrets/sftp.json
      SFTP_KNOWN_HOSTS: /run/secrets/known_hosts
      DATA_DIR: /data
      TZ: Asia/Bangkok
    volumes:
      - ./data:/data
      - ./secrets:/run/secrets:ro
    tmpfs:
      - /tmp:size=16m,mode=1777
