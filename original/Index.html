<!DOCTYPE html>
<html><head><base target="_top"><meta charset="utf-8">
<style>
:root{font-family:Inter,Arial,sans-serif;color:#172337;background:#f3f6fa}
*{box-sizing:border-box}body{margin:0;padding:28px 14px}.app{max-width:680px;margin:auto}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.brand{font-size:12px;letter-spacing:2px;font-weight:800;color:#25468a}h1{font-size:29px;letter-spacing:-.7px;margin:5px 0}p{margin:0;color:#66758a}
.card{background:white;border-radius:18px;padding:23px;margin:14px 0;box-shadow:0 3px 20px #1022480b}.status{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.pill{border-radius:25px;padding:7px 12px;background:#eef2fa;color:#375181;font-size:12px;font-weight:800}.pill.working{background:#def7e9;color:#0c7545}.pill.done{background:#e8efff;color:#244b9a}.clock{font-size:44px;font-weight:750;font-variant-numeric:tabular-nums;margin:17px 0 2px}.small{font-size:13px;color:#718096}.times{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}.times div{background:#f6f8fb;border-radius:12px;padding:17px}.times strong{display:block;font-size:22px;margin-top:10px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{border:0;background:#244c94;color:white;border-radius:12px;padding:16px;font-weight:800;cursor:pointer;font-size:15px}button.out{background:#e8eef8;color:#244c94}button:disabled{opacity:.35;cursor:not-allowed}.error{color:#b42318;padding:12px 0;white-space:pre-wrap}.good{color:#14794b;padding:9px 0}table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;color:#65748c;font-weight:600}th,td{padding:13px 6px;border-bottom:1px solid #edf0f5}td{font-variant-numeric:tabular-nums}.scroll{overflow-x:auto}footer{text-align:center;font-size:12px;color:#8491a4;margin-top:24px}
</style></head><body><div class="app"><header><div><div class="brand">POLA THAILAND</div><h1>WFH Attendance</h1><p id="identity">กำลังตรวจสอบบัญชีพนักงาน...</p></div><div style="font-size:34px">◷</div></header>
<section class="card"><div class="status"><b>ลงเวลาทำงานวันนี้</b><span id="status" class="pill">LOADING</span></div><div id="clock" class="clock">--:--:--</div><div class="small" id="today">Asia/Bangkok</div><div class="times"><div><span class="small">CLOCK IN</span><strong id="clockIn">--:--</strong></div><div><span class="small">CLOCK OUT</span><strong id="clockOut">--:--</strong></div></div><div class="actions"><button id="in" disabled onclick="submitClock('IN')">Clock In</button><button id="out" class="out" disabled onclick="submitClock('OUT')">Clock Out</button></div><div id="notice" role="status"></div></section>
<section class="card"><b>ประวัติ 10 รายการล่าสุด</b><div class="scroll"><table><thead><tr><th>วันที่</th><th>Clock In</th><th>Clock Out</th><th>สถานะ</th></tr></thead><tbody id="history"><tr><td colspan="4">กำลังโหลด...</td></tr></tbody></table></div></section><footer>เวลาใช้จาก Server · ไม่ใช่นาฬิกาของอุปกรณ์</footer></div>
<script>
let model=null,busy=true;
const $=id=>document.getElementById(id);
const timeOnly=x=>x?x.slice(11,16):'--:--';
function showError(e){$('notice').className='error';$('notice').textContent=(e&&e.message)||String(e);busy=false;updateButtons();}
function updateButtons(){ $('in').disabled=busy||!model||model.status!=='NOT_STARTED';$('out').disabled=busy||!model||model.status!=='WORKING'; }
function render(data){model=data;busy=false;$('identity').textContent=data.user.employeeId+' · '+data.user.name+' · '+data.user.department;$('today').textContent=data.today+' (Asia/Bangkok)';$('clockIn').textContent=timeOnly(data.clockIn);$('clockOut').textContent=timeOnly(data.clockOut);
const labels={NOT_STARTED:'ยังไม่ลงเวลา',WORKING:'กำลังทำงาน',COMPLETED:'ลงเวลาออกแล้ว'};$('status').textContent=labels[data.status]||data.status;$('status').className='pill '+(data.status==='WORKING'?'working':data.status==='COMPLETED'?'done':'');
$('notice').textContent='';$('history').replaceChildren();if(!data.history.length){const tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=4;td.textContent='ยังไม่มีข้อมูล';tr.appendChild(td);$('history').appendChild(tr)}
for(const r of data.history){const tr=document.createElement('tr');for(const txt of [r.date,timeOnly(r.clockIn),timeOnly(r.clockOut),r.status]){const td=document.createElement('td');td.textContent=txt;tr.appendChild(td)}$('history').appendChild(tr)}updateButtons();}
function load(){busy=true;updateButtons();google.script.run.withSuccessHandler(render).withFailureHandler(showError).getDashboard();}
function submitClock(action){if(busy||!model)return;busy=true;updateButtons();$('notice').textContent='กำลังบันทึก...';google.script.run.withSuccessHandler(render).withFailureHandler(showError).clock(action);}
setInterval(()=>{$('clock').textContent=new Intl.DateTimeFormat('th-TH',{timeZone:'Asia/Bangkok',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date())},1000);load();
</script></body></html>
